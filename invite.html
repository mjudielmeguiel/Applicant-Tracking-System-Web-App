<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Create your user account</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="invitation.css"><script src="profile-images.js" defer></script><script src="invite.js" defer></script></head><body class="invitation-page"><main class="invitation-card"><p class="invite-eyebrow">WORKSPACE INVITATION</p><h1>Create your user account</h1><p id="inviteCompany">Checking invitation…</p><p id="inviteCountdown" class="invite-countdown" role="timer"></p><p id="inviteError" class="form-error" role="alert" hidden></p><form id="invitedUserForm" hidden><label class="field-label" for="inviteAdminID">Linked AdminID</label><input class="field-input" id="inviteAdminID" readonly><label class="field-label" for="inviteFullName">Full name</label><input class="field-input" id="inviteFullName" autocomplete="name" minlength="2" maxlength="200" required><label class="field-label" for="inviteUsername">Username</label><input class="field-input" id="inviteUsername" autocomplete="username" pattern="[A-Za-z0-9_]{3,20}" title="3–20 letters, numbers or underscores" required><label class="field-label" for="inviteEmail">Email</label><input class="field-input" id="inviteEmail" type="email" autocomplete="email" maxlength="254" required><label class="field-label" for="invitePassword">Password</label><input class="field-input" id="invitePassword" type="password" autocomplete="new-password" minlength="8" required><label class="field-label" for="inviteConfirm">Confirm password</label><input class="field-input" id="inviteConfirm" type="password" autocomplete="new-password" minlength="8" required><label class="field-label" for="invitePhoto">Profile picture (optional)</label><input class="field-input" id="invitePhoto" type="file" accept="image/png,image/jpeg,image/webp"><img id="invitePhotoPreview" class="invite-photo" alt="Profile picture preview" hidden><p class="invite-note">PNG, JPEG or WebP up to 10 MB; resized before saving. This link can create one user account and expires 30 minutes after your admin creates it.</p><button class="btn btn-primary" id="registerInvitedUser" type="submit">Create account</button></form><a class="invite-login" href="index.html">Back to login</a></main></body></html>
